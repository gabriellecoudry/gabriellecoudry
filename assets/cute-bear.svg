<svg viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -8; 0 0" dur="2s" repeatCount="indefinite" />

    <!-- left ear -->
    <circle cx="62" cy="42" r="20" fill="#E9C7EE"/>
    <circle cx="62" cy="42" r="10" fill="#FFF0F6"/>
    <!-- right ear -->
    <circle cx="138" cy="42" r="20" fill="#E9C7EE"/>
    <circle cx="138" cy="42" r="10" fill="#FFF0F6"/>

    <!-- head -->
    <circle cx="100" cy="80" r="48" fill="#FFD6E8"/>

    <!-- muzzle -->
    <ellipse cx="100" cy="92" rx="24" ry="19" fill="#FFF0F6"/>

    <!-- eyes -->
    <circle cx="84" cy="72" r="4.5" fill="#5A2A45"/>
    <circle cx="116" cy="72" r="4.5" fill="#5A2A45"/>

    <!-- blush -->
    <circle cx="72" cy="88" r="7" fill="#FFB3D9" opacity="0.6"/>
    <circle cx="128" cy="88" r="7" fill="#FFB3D9" opacity="0.6"/>

    <!-- nose -->
    <ellipse cx="100" cy="88" rx="6" ry="4.5" fill="#5A2A45"/>
    <path d="M100 92 Q100 98 92 98" stroke="#5A2A45" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M100 92 Q100 98 108 98" stroke="#5A2A45" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="100" cy="163" rx="52" ry="42" fill="#FFD6E8"/>
    <ellipse cx="100" cy="170" rx="26" ry="20" fill="#FFF0F6"/>

    <!-- left leg -->
    <ellipse cx="72" cy="200" rx="16" ry="10" fill="#E9C7EE"/>
    <!-- right leg -->
    <ellipse cx="128" cy="200" rx="16" ry="10" fill="#E9C7EE"/>

    <!-- left arm (static, resting) -->
    <ellipse cx="52" cy="150" rx="14" ry="20" fill="#E9C7EE" transform="rotate(20 52 150)"/>

    <!-- right arm (waving) -->
    <g transform-origin="148 140">
      <animateTransform attributeName="transform" type="rotate"
        values="0 148 140; -35 148 140; 0 148 140; -35 148 140; 0 148 140"
        dur="1.4s" repeatCount="indefinite"/>
      <ellipse cx="148" cy="140" rx="14" ry="20" fill="#E9C7EE"/>
    </g>
  </g>
</svg>
